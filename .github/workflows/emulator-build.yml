name: Emulator Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-emulator:
    name: Build and test emulator library
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and run tests
      run: script/test

    - name: Upload test images
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-images
        path: build/emulator/*.ppm
        if-no-files-found: warn
