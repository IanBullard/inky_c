name: Hardware Build (Raspberry Pi)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-hardware-rpi:
    name: Build Hardware Library (Raspberry Pi)
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, Linux, ARM32, Pi]
            arch: armv7l
            name: "Raspberry Pi (32-bit)"
          - runner: [self-hosted, Linux, ARM64, Pi]
            arch: aarch64
            name: "Raspberry Pi (64-bit)"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify Raspberry Pi environment
      run: |
        echo "Running on: ${{ matrix.name }}"
        echo "Architecture: $(uname -m)"
        echo "OS: $(uname -s)"
        echo "Kernel: $(uname -r)"

        # Verify we're on Linux ARM
        if [ "$(uname -s)" != "Linux" ]; then
          echo "Error: Not running on Linux"
          exit 1
        fi

        ARCH=$(uname -m)
        if [ "$ARCH" != "armv7l" ] && [ "$ARCH" != "aarch64" ]; then
          echo "Error: Not running on ARM architecture (found: $ARCH)"
          exit 1
        fi

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Clean previous builds
      run: make clean

    - name: Build hardware library
      run: make hardware

    - name: Verify library was built
      run: |
        if [ ! -f lib/libinky_hw.a ]; then
          echo "Error: Hardware library was not built"
          exit 1
        fi
        echo "Hardware library built successfully"
        ls -lh lib/libinky_hw.a

    - name: Upload hardware library artifact
      uses: actions/upload-artifact@v4
      with:
        name: libinky-hardware-${{ matrix.arch }}
        path: lib/libinky_hw.a

    - name: Build test programs (for verification only)
      run: |
        echo "Note: Test programs built but not run (would require actual hardware)"
        # Tests would require actual Inky display hardware connected
        # We just verify they compile
        echo "Hardware build verification complete"
